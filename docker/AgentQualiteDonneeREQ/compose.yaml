services:
  keycloak_postgres:
    container_name: keycloak_postgres
    image: postgres:18.6
    environment:
      - POSTGRES_USER=keycloak_pg_admin
      - POSTGRES_PASSWORD=keycloak_pg_password
      - POSTGRES_DB=keycloak
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql
    networks:
      - backend
  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.7.3
    command: start-dev --import-realm
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=Baloney123!
      - KC_DB=postgres
      - KC_DB_URL_DATABASE=keycloak
      - KC_DB_USERNAME=keycloak_pg_admin
      - KC_DB_PASSWORD=keycloak_pg_password
      - KC_DB_URL_PORT=5432
      - KC_DB_URL_HOST=keycloak_postgres
      - KC_HOSTNAME_STRICT=false
      - KC_CACHE=local
    depends_on:
      - keycloak_postgres
    ports:
      - "8080:8080"
    volumes:
      - ./req-realm.json:/opt/keycloak/data/import/req-realm.json:ro
    networks:
      - backend
      - frontend

volumes:
  keycloak_postgres_data:
    driver: local

networks:
  backend:
    driver: bridge
    internal: true
  frontend:
    driver: bridge